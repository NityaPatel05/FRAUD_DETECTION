# ─────────────────────────────────────────────
#  fraud_detection/configs/config.yaml
# ─────────────────────────────────────────────

# ── Paths ────────────────────────────────────
paths:
  raw_dir:               "data/raw"
  processed_tree:        "data/processed/tree_models"
  processed_catboost:    "data/processed/catboost"
  processed_vae:         "data/processed/dl_models/vae"
  processed_bilstm:      "data/processed/dl_models/bilstm"
  processed_gnn:         "data/processed/dl_models/gnn"
  feature_store_dir:     "data/feature_store"
  artifacts:             "artifacts"
  checkpoints:           "artifacts/checkpoints"
  shap_dir:              "artifacts/shap"
  metrics_dir:           "artifacts/metrics"
  logs_dir:              "logs"
  processed_v2:          "data/processed/v2_{mode}"   # v2 tree features ({mode}=causal|transductive)
  artifacts_v2:          "artifacts/v2/{mode}"        # v2 models/metrics (legacy checkpoints untouched)

# ── Redis ─────────────────────────────────────
redis:
  host:       "localhost"
  port:       6379
  db:         0
  ttl_days:   30        # expire keys after 30 days

# ── Data Split ────────────────────────────────
split:
  train_quantile: 0.75  # first 75% of TransactionDT range → train

# ── Preprocessing ─────────────────────────────
preprocessing:
  nan_fill_trees:    -999
  nan_fill_dl:       "median"
  m_col_nan_fill_trees: -1   # T=1, F=0, NaN=-1
  m_col_nan_fill_vae:   0    # T=1, F=0, NaN=0 for VAE

# ── Feature Engineering ───────────────────────
feature_engineering:
  v_col_corr_threshold:  0.9    # drop one of pair if Pearson corr > 0.9
  v_pca_components:      3      # PCA components per NaN group (DL only)
  top_v_cols_shap:       50     # top V cols by SHAP for tree models
  important_v_cols:
    - V258
    - V257
    - V201
    - V189
    - V187
    - V294
    - V83
    - V76

  c_cols:   [C1, C2, C3, C4, C5, C6, C7, C8, C9, C11, C13, C14]
  d_cols:   [D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15]
  m_cols:   [M1, M2, M3, M4, M5, M6, M7, M8, M9]

  freq_cols_tree:
    - card1
    - card2
    - card3
    - card4
    - card5
    - card6
    - addr1
    - addr2
    - P_emaildomain
    - R_emaildomain
    - DeviceInfo
    - DeviceType
    - uid1
    - uid_magic
    - id_20
    - id_31

  # CatBoost gets raw strings for these (no label-encode, no freq-encode)
  catboost_cat_cols:
    - card4
    - card6
    - ProductCD
    - DeviceType
    - P_emaildomain

  velocity_windows:
    - 3600      # 1 hour
    - 86400     # 24 hours

# ── BiLSTM Sequence ───────────────────────────
bilstm:
  seq_len:      20
  features_per_step: 12
  step_features:
    - TransactionAmt_log
    - amt_zscore
    - uid_gap_last
    - hour_sin
    - hour_cos
    - is_late_night
    - uid_tx_1h
    - uid_total_amt_24h
    - D1_norm
    - device_mobile
    - ProductCD_encoded
    - M_match_count

# ── Inference Thresholds ──────────────────────
inference:
  auto_approve:   0.20
  flag_review:    0.70
  # p < 0.20  → Auto-approve
  # 0.20–0.70 → Flag for review / 3DS
  # p > 0.70  → Block + alert

# ── Adversarial Validation ────────────────────────────────────────────────────
adversarial:
  drop_threshold: 0.70   # drop feature if single-feat adversarial AUC > 0.70

# ── Neo4j (Job 1 — GNN refresh) ───────────────────────────────────────────────
neo4j:
  uri:          "bolt://localhost:7687"
  user:         "neo4j"
  password:     "password"           # override with env var NEO4J_PASSWORD in prod
  database:     "neo4j"
  lookback_secs: 86400               # pull last 24 h of edges for each refresh cycle

# ── GNN refresh job ───────────────────────────────────────────────────────────
gnn:
  proj_dim:       128                # must match training config
  embed_dim:      64                 # must match training config
  refresh_interval_secs: 60         # how often to re-run GraphSAGE (1–5 min)
  redis_embedding_ttl:   1800       # TTL for gnn:{card_id} keys in Redis (30 min)

# ── Kafka (Job 2 — post-inference streaming) ───────────────────────────────────
kafka:
  bootstrap_servers: "localhost:9092"
  graph_topic:       "graph-updates"         # Neo4j Kafka connector sinks this topic
  label_topic:       "confirmed_fraud_labels" # fraud_label_consumer.py reads this
  enabled:           true                    # set false for local dev without Kafka

# ── Database (fraud feedback + retrain audit) ─────────────────────────────────
database:
  url: "postgresql://fraud:password@localhost:5432/fraud_db"
  # For local SQLite testing (no PostgreSQL needed):
  # url: "sqlite:///fraud_local.db"

# ══════════════════════════════════════════════════════════════════════════════
#  v2 pipeline (tree models) — see scripts/run_feature_engineering.py,
#  scripts/run_feature_selection.py, scripts/run_training.py
# ══════════════════════════════════════════════════════════════════════════════
# ══════════════════════════════════════════════════════════════════════════════
#  ONE label policy (src/labels/policy.py) -- features, training targets, evaluation, serving
#  Real labels are late: a fraud is known `d` days after the transaction (chargeback delay);
#  a transaction with no known fraud label is only trusted as legit once it is `maturity_days`
#  old. Re-run at other assumptions with run_all.py --label-median-days 60 --tag-suffix _d60.
# ══════════════════════════════════════════════════════════════════════════════
label_policy:
  delay_median_days:  35        # median fraud-label (chargeback) delay; lognormal, per-TransactionID hash
  delay_sigma:        0.6       # lognormal shape (~6% of frauds take longer than 90 d)
  delay_min_days:     1
  delay_cap_days:     120
  maturity_days:      90        # unreported -> treated as legit after this (was feedback_v2.maturity_days)
  train_gap_days:     7         # rows this close before the cutoff are dropped from training (train | gap | val)
  seed:               20240601

fe_v2:
  # causal       = client statistics use only past rows (servable online; honest score)
  # transductive = statistics over all rows incl. future (Kaggle 1st-place style; optimistic)
  agg_mode:             causal
  # label timing: see the top-level `label_policy` section (one policy for features, training, eval, serving)
  label_smoothing:      20.0      # pseudo-count pulling entity fraud rates to the global rate
  velocity_windows_sec: [3600, 86400, 604800, 2592000]   # 1h, 1d, 7d, 30d
  count_window_days:    30        # causal count-encoding window
  v_corr_threshold:     0.75
  use_label_history:    true
  use_graph_features:   true
  # schema: full = all IEEE-CIS columns (best-accuracy benchmark)
  #         raw  = only fields a real payment gateway receives + our own features
  #                (drops Vesta pre-computed V*, C*, D2-D15, id_01-id_11) → the model the live system serves
  schema:               full
  drop_cols:            null      # null → derived_signals.DEFAULT_DROP (data-study removals)
  use_derived_signals:  true      # Phase 2: cross-border, proxy, email class, device parsing …
  use_behaviour_v3:     true      # Phase 3: replaces BiLSTM (EMA profiles, multi-entity velocity, lags, habits)
  use_network_v4:       true      # Phase 4: replaces GNN (shared-entity windows, 2-hop exposure, clusters, rings)
  use_hmm_features:     true      # Phase 3e: HMM "surprise" of the current txn given the last 2 (Lucas et al.)
  hmm_states:           5
  ema_half_lives_sec:   [3600, 86400, 604800, 2592000]
  hub_cap:              20        # a device shared by more clients than this stops linking identities

training_v2:
  # cpu | gpu. gpu → XGBoost device=cuda, CatBoost task_type=GPU, LightGBM device_type=gpu
  # (LightGBM falls back to CPU automatically if its wheel has no GPU support).
  # Feature engineering always runs on CPU (pandas + numba) — it is not the bottleneck.
  device:         cpu
  # Time-ordered CV inside the train period: each fold validates on a later
  # window, separated from its training data by a gap (label-delay realism).
  # Rolling (prequential) folds: train | gap | val, targets as known at each cutoff (label_policy).
  # The first `es_frac` of each val window is used ONLY for early stopping, the rest ONLY for scoring.
  n_folds:        5
  fold_val_days:  10
  es_frac:        0.5
  gap_days:       7               # legacy readers (sim track, heldout, sequence); the trainer uses label_policy.train_gap_days
  cp_k:           100             # card/client precision@k per day
  refit_max_round_scale: 1.5      # refit rounds = mean(best_iter) * min(n_refit_rows / n_fold_train_rows, this)
  n_seeds:        3               # seed-bagging for the refit models
  early_stopping_rounds: 200
  models:         [lgbm, xgb]     # CatBoost got blend weight 0 and cost 2.8 h of tuning: opt in with --models ... catboost
  postprocess_uid_smoothing: true # also report AP after averaging scores per client

  lgbm:
    objective:         binary
    learning_rate:     0.02
    n_estimators:      6000       # upper bound; early stopping picks the real number
    num_leaves:        384
    max_depth:         -1
    min_child_samples: 100
    subsample:         0.8
    subsample_freq:    1
    colsample_bytree:  0.4
    reg_lambda:        2.0
    reg_alpha:         0.0
    scale_pos_weight:  1.0        # NO class weighting: it lowered AUC-PR in every study we found
    n_jobs:            -1
    verbose:           -1
    # GPU only (ignored on CPU): OpenCL platform/device of the NVIDIA card. Leave -1 for
    # auto; set after `scripts/gpu_smoke_test.py` shows which platform is NVIDIA.
    gpu_platform_id:   -1
    gpu_device_id:     -1
    gpu_max_bin:       255        # 63 (LightGBM's GPU speed tip) lost accuracy on ~400 tabular columns

  xgb:                            # Deotte (IEEE-CIS 1st place) settings
    objective:         "binary:logistic"
    learning_rate:     0.02
    n_estimators:      6000
    max_depth:         12
    subsample:         0.8
    colsample_bytree:  0.4
    min_child_weight:  1
    tree_method:       hist
    eval_metric:       aucpr
    scale_pos_weight:  1.0
    n_jobs:            -1

  catboost:
    learning_rate:     0.03
    iterations:        6000
    depth:             8
    l2_leaf_reg:       5
    eval_metric:       PRAUC
    has_time:          true       # ordered target statistics follow time order
    gpu_eval_metric:   Logloss    # PRAUC is CPU-only in CatBoost: on GPU early stopping uses this instead
    thread_count:      -1
    verbose:           500

# ══════════════════════════════════════════════════════════════════════════════
#  Phase 6 — novelty layer (replaces the VAE): scripts/run_novelty_monitoring.py
# ══════════════════════════════════════════════════════════════════════════════
novelty:
  out_dir:            "artifacts/v2/novelty"
  period_sec:         3600          # hourly segment series
  segment_cols:       [ProductCD, card4, card6, P_email_class, DeviceType, amount_band, addr2]
  z_threshold:        6.0           # robust z vs the segment's own previous week
  min_periods:        2             # sustained for >= 2 consecutive hours
  min_volume:         20            # ignore tiny segments
  baseline_periods:   168           # 1 week of hours
  max_alerts_to_mine: 10
  rule_cols:          [ProductCD, card4, card6, P_emaildomain, DeviceType, addr2, card3, card5, amount_band, P_email_class]
  min_support:        0.05
  min_lift:           3.0
  max_rules_per_alert: 5
  min_backtest_precision: 0.10      # vs ~3.5% base rate
  rule_ttl_days:      14            # every rule expires
  discovery_num_cols: [TransactionAmt, uid_n_1h, uid_n_1d, uid_amt_sum_1d, amt_z_vs_own_past,
                       uid_hours_since_prev, device_fp_clients_7d, uid_ema_burst, card1_addr1_n_1h]

# ══════════════════════════════════════════════════════════════════════════════
#  Phase 7 — decision layer (src/serving/decision.py, scripts/run_policy_simulation.py)
#  Costs are in the transaction currency. These are ASSUMPTIONS — set them with the
#  business; run_policy_simulation.py shows how decisions and money change with them.
# ══════════════════════════════════════════════════════════════════════════════
decision_v2:
  bundle_kind:                 refit      # refit (trained on train) | final (train+val)
  fraud_loss_rate:             1.0        # share of the amount lost when fraud is approved
  chargeback_fee:              15.0
  margin_rate:                 0.03       # profit on a legit sale (lost if declined)
  decline_cost:                0.5        # operational cost of any decline
  false_decline_churn_cost:    20.0       # future business lost when a GOOD customer is declined
  step_up_cost:                0.3        # 3DS / OTP cost
  step_up_fraud_stop_rate:     0.8
  step_up_legit_abandon_rate:  0.05
  review_cost:                 3.0        # analyst minutes
  review_fraud_stop_rate:      0.9
  review_capacity_per_day:     500        # analysts can review this many per day
  review_min_p:                0.0        # set by run_policy_simulation.py from capacity
  explain_min_p:               0.2        # attach reason codes above this score
  decision_log:                "artifacts/v2/decisions/decisions.jsonl"
  rules_file:                  "artifacts/v2/novelty/active_rules.yaml"
  lists_file:                  "artifacts/v2/decisions/lists.yaml"   # allow/block lists
  state_snapshot:              "artifacts/v2/decisions/engine_state.pkl"

# ══════════════════════════════════════════════════════════════════════════════
#  Phase 8 — feedback loop & safe deployment (src/feedback/, src/jobs/retrain_v2.py)
# ══════════════════════════════════════════════════════════════════════════════
feedback_v2:
  # maturity_days moved to label_policy.maturity_days (single source of truth)
  registry:           "artifacts/v2/registry.json"
  monitoring_dir:     "artifacts/v2/monitoring"
  psi_reference_days: 7
  alert_bands:                    # metric: [low, high]
    rate_decline:     [0.0, 0.03]
    rate_review:      [0.0, 0.02]
    p99_latency_ms:   [0.0, 50.0]
    score_psi:        [0.0, 0.2]
    fpr_flagged:      [0.0, 0.02]
  promotion:
    min_ap_gain:      0.005       # same keep rule as feature ablations
    max_rate_shift:   0.25        # decline/review/step-up rates may move at most ±25% (SafetyNet)
    fpr:              0.01
  explore_q_max:      0.05        # P(let a would-be-blocked txn through), decays with score…
  explore_q_min:      0.001       # …down to 1 in 1000 for the riskiest
  sim_current_block_rate: 0.01
  sim_candidate_block_rates: [0.005, 0.01, 0.02, 0.03]
